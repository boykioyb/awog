<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale / user-scalable=no: blocking pinch-zoom fails WCAG 1.4.4
         and iOS ignores it since 10 anyway. viewport-fit=cover keeps the app under
         the notch, interactive-widget=resizes-content lets viewport.ts measure the
         software keyboard. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AWOG Remote" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>AWOG Remote</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
