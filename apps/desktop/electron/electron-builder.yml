appId: guild.awog.desktop
productName: AWOG
copyright: AWOG

# Use productName (not the scoped package name @awog/desktop) for output files —
# the "/" in the scope made fpm try to write into a non-existent @awog/ dir.
artifactName: ${productName}-${version}-${arch}.${ext}

directories:
  output: release
  buildResources: build

# The Electron app is the compiled main/preload (CJS) + package.json. Its only
# runtime dependency is electron-updater (ADR 0028) — electron-builder auto-includes
# production `dependencies` node_modules into the asar; everything else is a devDependency.
files:
  - dist/**/*
  - package.json
  - '!**/*.map'

# Engine + UI ship as resources OUTSIDE the asar:
#  - the engine is spawned as a child process (ELECTRON_RUN_AS_NODE), so its
#    node_modules (incl. native node-pty) must be real files on disk;
#  - the SPA is served via the app:// protocol from resources/ui.
extraResources:
  - from: ../ui-next/.output/public
    to: ui
  - from: ../sidecar/dist
    to: sidecar
  # Bundled openvpn per platform+arch (VPN Manager, ADR 0065). Populated by
  # `pnpm vendor:openvpn` (scripts/vendor-openvpn.mjs) before packaging; the dir
  # may be empty (only a .gitkeep), in which case the app falls back to a system
  # openvpn. Filtered to this host's platform so a build never ships another OS's binary.
  - from: vendor/openvpn
    to: openvpn
    filter:
      - '${platform}-${arch}/**'
  - from: build/tray.png
    to: tray.png
  - from: build/trayTemplate.png
    to: trayTemplate.png
  - from: build/trayTemplate@2x.png
    to: trayTemplate@2x.png

# node-pty in the engine bundle is rebuilt for Electron's ABI by scripts/pack.mjs
# (electron-rebuild), not by electron-builder — the native dep lives under
# extraResources, which electron-builder does not rebuild.
npmRebuild: false

# NOTE: do NOT strip locales via `electronLanguages`. Limiting to [en, vi]
# produced "resource_bundle.cc: locale resources are not loaded" on Windows
# right before a renderer crash on the Sessions route — ship all locales.

mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # Unsigned by default (internal/testing). Set CSC_* + notarize via CI secrets
  # to enable signing — see docs/release.md.

win:
  target:
    - nsis
  icon: build/icon.ico

linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: build/icon.png
  # .deb requires a maintainer ("Name <email>"); github noreply avoids exposing
  # a personal address.
  maintainer: AWOG <boykioyb@users.noreply.github.com>

# Upload to a DRAFT GitHub Release keyed by the tag (CI: --publish always +
# GH_TOKEN). Review assets across platforms, then publish manually.
publish:
  provider: github
  releaseType: draft
