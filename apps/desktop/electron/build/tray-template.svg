<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- macOS menubar template: alpha is all that matters (opaque → black/white
       per appearance; transparent → menubar shows through). The card text lines,
       the gap between the stacked cards, and the notification-dot ring are
       carved as TRANSPARENT holes via the mask. -->
  <defs>
    <mask id="glyph">
      <rect width="24" height="24" fill="black"/>
      <!-- back card (the stack peeking out bottom-left) -->
      <rect x="3.2" y="8.8" width="12.6" height="10" rx="2" fill="white"/>
      <!-- transparent gap separating back + front card -->
      <rect x="5.8" y="4.3" width="14.4" height="11.4" rx="2.7" fill="black"/>
      <!-- front card -->
      <rect x="6.7" y="5.2" width="12.6" height="9.6" rx="2.2" fill="white"/>
      <!-- text lines (transparent cutouts) -->
      <rect x="9" y="8" width="7.4" height="1.5" rx="0.75" fill="black"/>
      <rect x="9" y="10.7" width="5" height="1.5" rx="0.75" fill="black"/>
      <!-- transparent ring around the notification dot -->
      <circle cx="17.9" cy="7.1" r="2.6" fill="black"/>
    </mask>
  </defs>
  <rect width="24" height="24" fill="black" mask="url(#glyph)"/>
  <!-- notification dot (sits inside its transparent ring) -->
  <circle cx="17.9" cy="7.1" r="1.7" fill="black"/>
</svg>
