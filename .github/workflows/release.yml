# Stable cross-platform release builds (macOS / Linux / Windows) via Electron.
#
# Trigger: push a tag `vX.Y.Z` (matching the version in the root package.json).
# Each OS runner builds the AWOG Electron app and uploads the installers to a
# DRAFT GitHub Release for review before publishing. `workflow_dispatch` allows
# test builds without a tag.
#
# Why a per-OS matrix: the engine bundles the platform-specific Claude CLI binary
# (@anthropic-ai/claude-agent-sdk-<os>-<arch>) and node-pty is rebuilt for
# Electron's ABI — neither cross-compiles, and the electron-builder targets
# (.dmg/.zip, .nsis, .AppImage/.deb) are native, so each platform builds itself.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# electron-builder needs write access to create the release + upload assets.
permissions:
  contents: write

# Re-tagging the same version (common while iterating) supersedes the old run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# `nuxt generate` OOMs the default Node heap on the smaller runners — give it room.
env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      # Serialize: all jobs run `electron-builder --publish always` against the
      # same GitHub release. Running them concurrently races on creating/updating
      # the release and silently drops one platform's assets (the Windows .exe +
      # latest.yml went missing in v0.5.2). One-at-a-time = every asset lands.
      max-parallel: 1
      matrix:
        include:
          - label: macos-arm64
            platform: macos-14
          # macOS Intel (x64) dropped: GitHub macos-13 runners queue for 30-60min+.
          # Re-add a macos-13 entry (or a universal build) when runners are reliable.
          - label: linux-x64
            platform: ubuntu-22.04
          - label: windows-x64
            platform: windows-latest
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tag builds must match the version in the root package.json, or installers
      # and the GitHub Release would disagree. (Cargo/tauri.conf are gone.)
      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match app version $PKG — bump package.json (root + ui-next + sidecar + electron) first."
            exit 1
          fi

      # The "What's New" changelog (apps/desktop/ui-next/utils/changelog.ts) is hand-
      # maintained: CURRENT_VERSION derives from its top entry. v0.11.0 and v0.12.0
      # shipped without their entries, leaving the panel stuck at 0.10.0. Fail the
      # release if the newest changelog entry does not match the app version.
      - name: Verify changelog is up to date
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          TOP=$(node -e "const s=require('fs').readFileSync('apps/desktop/ui-next/utils/changelog.ts','utf8');const m=s.match(/version:\s*'([0-9]+\.[0-9]+\.[0-9]+)'/);process.stdout.write(m?m[1]:'')")
          echo "changelog top=$TOP  package.json=$PKG"
          if [ "$TOP" != "$PKG" ]; then
            echo "::error::Changelog top entry ($TOP) does not match app version $PKG — add a '$PKG' release to apps/desktop/ui-next/utils/changelog.ts before tagging."
            exit 1
          fi

      - name: Set up pnpm
        # No `version` input — action-setup reads it from the root package.json
        # "packageManager" field (pnpm@10.33.0). Specifying both errors with
        # "Multiple versions of pnpm specified". pnpm 10 is required:
        # `pnpm deploy --legacy` (engine build) is pnpm-10-only.
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pack.mjs: nuxt generate → engine bundle (pnpm deploy, flat node_modules +
      # platform CLI) → node-pty electron-rebuild (optional) → tsc → electron-builder.
      # --publish always uploads to a draft GitHub Release keyed by the tag.
      - name: Build + publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned by default (internal/testing). To enable macOS signing +
          # notarization, add CSC_LINK / CSC_KEY_PASSWORD / APPLE_ID /
          # APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID secrets and drop the
          # CSC_IDENTITY_AUTO_DISCOVERY override below. See docs/release.md.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm --filter @awog/desktop exec node scripts/pack.mjs --publish always
